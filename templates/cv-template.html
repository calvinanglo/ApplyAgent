<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'Garamond', 'EB Garamond', 'Times New Roman', serif;
    font-size: 11px; /* default — auto-sized per PDF to maximize readability while fitting 1 page */
    line-height: 1.3;
    color: #000;
    background: #ffffff;
    padding: 0;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 0;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 6px;
  }

  .header h1 {
    font-family: 'Garamond', 'EB Garamond', 'Times New Roman', serif;
    font-size: 20px;
    font-weight: 700;
    color: #000;
    margin-bottom: 2px;
  }

  .header-gradient {
    height: 1px;
    background: #000;
    margin-bottom: 4px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    font-size: 10px;
    color: #333;
  }

  .contact-row a {
    color: #333;
    text-decoration: none;
  }

  .contact-row .separator {
    color: #999;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 6px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #000;
    border-bottom: 1px solid #000;
    padding-bottom: 1px;
    margin-bottom: 4px;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-text {
    font-size: 11px;
    line-height: 1.35;
    color: #000;
  }

  /* Links must never break across lines */
  a {
    white-space: nowrap;
  }

  /* === CORE COMPETENCIES === */
  .competencies-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 4px;
  }

  .competency-tag {
    font-size: 10px;
    font-weight: 400;
    color: #000;
    background: none;
    padding: 0;
    border-radius: 0;
    border: none;
  }

  .competency-tag::after {
    content: " \00b7";
    color: #999;
  }

  .competency-tag:last-child::after {
    content: "";
  }

  /* === GITHUB PROJECTS === */
  .competencies-grid:has(.github-project) {
    display: block;
  }

  .github-project {
    margin-bottom: 1px;
    font-size: 10px;
    line-height: 1.5;
  }

  .github-link {
    font-weight: 600;
    color: #000;
    text-decoration: none;
  }

  .github-desc {
    color: #000;
  }

  .github-desc::before {
    content: " — ";
    color: #999;
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 6px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0px;
  }

  .job-company {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .job-period {
    font-size: 10px;
    color: #444;
    white-space: nowrap;
  }

  .job-role {
    font-size: 11px;
    font-weight: 400;
    font-style: italic;
    color: #000;
    margin-bottom: 2px;
  }

  .job-location {
    font-size: 10px;
    color: #444;
  }

  .job ul {
    padding-left: 14px;
    margin-top: 1px;
  }

  .job li {
    font-size: 10.5px;
    line-height: 1.3;
    color: #000;
    margin-bottom: 0px;
  }

  .job li strong {
    font-weight: 700;
  }

  /* === PROJECTS === */
  .project {
    margin-bottom: 4px;
  }

  .project-title {
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }

  .project-badge {
    font-size: 8px;
    font-weight: 400;
    color: #444;
    background: none;
    padding: 0;
    border-radius: 0;
    margin-left: 4px;
  }

  .project-desc {
    font-size: 10.5px;
    color: #000;
    margin-top: 0px;
  }

  .project-tech {
    font-size: 10px;
    color: #444;
    margin-top: 0px;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 2px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .edu-title {
    font-weight: 700;
    font-size: 11px;
    color: #000;
  }

  .edu-org {
    color: #000;
    font-weight: 400;
  }

  .edu-year {
    font-size: 10px;
    color: #444;
  }

  .edu-desc {
    font-size: 10px;
    color: #333;
  }

  /* === CERTIFICATIONS === */
  /* New inline layout: one row, pipe-separated names, optional Credly link. */
  .cert-inline {
    font-size: 10.5px;
    color: #000;
    line-height: 1.5;
  }

  .cert-sep {
    color: #999;
    margin: 0 4px;
  }

  .cert-verify {
    color: #000;
    text-decoration: underline;
  }

  /* Legacy block layout kept for backward-compat with any rendered docs. */
  .cert-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1px;
  }

  .cert-title {
    font-size: 10.5px;
    font-weight: 400;
    color: #000;
  }

  .cert-org {
    color: #000;
    font-weight: 700;
  }

  .cert-year {
    font-size: 10px;
    color: #444;
  }

  /* === SKILLS === */
  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
  }

  .skill-item {
    font-size: 10.5px;
    color: #000;
  }

  .skill-category {
    font-weight: 700;
    color: #000;
    font-size: 10.5px;
  }

  .skill-line {
    margin-bottom: 1px;
    font-size: 10.5px;
    color: #000;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      padding: 0;
    }
  }

  /* === PAGE BREAK CONTROL === */
  .avoid-break {
    break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    {{CONTACT_ROW}}
  </div>

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  <!-- CORE COMPETENCIES -->
  <div class="section">
    <div class="section-title">{{SECTION_COMPETENCIES}}</div>
    <div class="competencies-grid">
      {{COMPETENCIES}}
    </div>
  </div>

  <!-- WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- PROJECTS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_PROJECTS}}</div>
    {{PROJECTS}}
  </div>

  <!-- EDUCATION & CERTIFICATIONS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

  <div class="section avoid-break">
    <div class="section-title">{{SECTION_CERTIFICATIONS}}</div>
    {{CERTIFICATIONS}}
  </div>

  <!-- SKILLS -->
  <div class="section avoid-break">
    <div class="section-title">{{SECTION_SKILLS}}</div>
    {{SKILLS}}
  </div>

</div>
</body>
</html>
