  <path d="M155 328 L172 328 L172 345" stroke="#6B7280" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ApplyAgent text watermark -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="white" letter-spacing="2">ApplyAgent<tspan fill="#9CA3AF">.ca</tspan></text>
</svg>
