<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#171717"/>

  <!-- Document/resume shape -->
  <rect x="160" y="80" width="192" height="240" rx="12" fill="white"/>

  <!-- Document lines (resume content) -->
  <rect x="190" y="118" width="80" height="8" rx="4" fill="#D1D5DB"/>
  <rect x="190" y="138" width="132" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="156" width="132" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="174" width="100" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="200" width="60" height="8" rx="4" fill="#D1D5DB"/>
  <rect x="190" y="220" width="132" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="238" width="132" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="190" y="256" width="80" height="6" rx="3" fill="#E5E7EB"/>

  <!-- Checkmark circle (approval/success) -->
  <circle cx="340" cy="310" r="68" fill="#22C55E"/>
  <path d="M306 310 L328 332 L374 286" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

